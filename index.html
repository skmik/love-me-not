<!DOCTYPE html>

<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>love me not</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        width: 100%;
        height: 100vh;
        overflow: hidden;
        font-family: Arial, sans-serif;
        background: #f5f5f5;
    }

    #yes {
        position: fixed;
        top: 50%;
        left: 40%;
        transform: translate(-50%, -50%);

        background: #c729b2;
        color: white;
        border: none;
        border-radius: 15px;
        cursor: pointer;
        font-weight: bold;

        font-size: 32px;
        padding: 20px 45px;

        transition:
            font-size 0.4s ease,
            padding 0.4s ease,
            all 0.3s ease;

        z-index: 2;
    }

    #no {
        position: fixed;
        top: 50%;
        left: 60%;

        transform: translate(-50%, -50%);

        background: #4a0950;
        color: white;
        border: none;
        border-radius: 15px;
        cursor: pointer;
        font-weight: bold;

        font-size: 32px;
        padding: 20px 45px;

        transition: all 0.4s ease;

        z-index: 1;
    }

    #question{
        position: fixed;
        top: 30%;
        left: 50%;

        transform: translate(-50%, -50%);

        margin: 0;
        width: 100%;

        text-align: center;

        font-size: clamp(32px, 5vw, 64px);
        font-weight: bold;
        color: #000000;

        text-shadow: 0 3px 10px rgba(74, 9, 80, 0.2);

        letter-spacing: 1px;

        transition: all 0.3s ease;
    }
</style>


</head>

<body>
<p id="question">Kochasz mnie hihi?</p>

<button id="yes">TAK</button>
<button id="no">NIE</button>

<script>
    const yesButton = document.getElementById("yes");
    const noButton = document.getElementById("no");

    let yesSize = 32;
    let yesPadding = 45;

    let noSize = 32;
    let noPadding = 45;

    let clicks = 0;

    // Miejsca, do których może przemieszczać się NIE
    const positions = [
        { x: 80, y: 20 },
        { x: 75, y: 80 },
        { x: 20, y: 20 },
        { x: 20, y: 80 },
        { x: 85, y: 50 },
        { x: 15, y: 50 },
        { x: 70, y: 30 },
        { x: 30, y: 75 }
    ];

    noButton.addEventListener("click", function () {
        clicks++;

        // Powiększanie TAK
        yesSize += 15;
        yesPadding += 10;

        yesButton.style.fontSize = yesSize + "px";
        yesButton.style.padding =
            (20 + clicks * 5) + "px " + yesPadding + "px";

        // Pomniejszanie NIE
        noSize -= 3;
        noPadding -= 3;

        if (noSize < 12) {
            noSize = 12;
        }

        if (noPadding < 8) {
            noPadding = 8;
        }

        noButton.style.fontSize = noSize + "px";
        noButton.style.padding = "10px " + noPadding + "px";

        // Przenoszenie NIE w kolejne miejsce
        if (clicks < 6) {
            const position =
                positions[(clicks - 1) % positions.length];

            noButton.style.left = position.x + "%";
            noButton.style.top = position.y + "%";
        }

        // Po 6 kliknięciach TAK zajmuje cały ekran
        if (clicks >= 6) {
            yesButton.style.position = "fixed";
            yesButton.style.top = "0";
            yesButton.style.left = "0";

            yesButton.style.transform = "none";

            yesButton.style.width = "100vw";
            yesButton.style.height = "100vh";

            yesButton.style.padding = "0";
            yesButton.style.fontSize = "80px";
            yesButton.style.borderRadius = "0";

            noButton.style.display = "none";
        }
    });
    yesButton.addEventListener("click", function () {
        window.location.href = "hihi.html";
    });

</script>

</body>
</html>
