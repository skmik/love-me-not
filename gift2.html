<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gift Two 💕</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            background: linear-gradient(
                135deg,
                #fce4f5,
                #ead4ff
            );

            color: #4a0950;
        }

        .container {
            width: min(900px, 92%);
            text-align: center;
        }

        /* GŁÓWNA KARTA */

        .music-card {
            display: flex;
            align-items: center;
            justify-content: center;

            gap: 35px;

            padding: 35px;

            background: #fff0f7;

            border-radius: 25px;

            box-shadow:
                0 15px 40px rgba(74, 9, 80, 0.18);

            border: 2px solid rgba(255, 255, 255, 0.8);
        }


        /* PŁYTA */

        .record-area {
            width: 220px;
            height: 220px;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #f7b7d3;

            border-radius: 20px;

            flex-shrink: 0;
        }

        .record {
            width: 150px;
            height: 150px;

            border-radius: 50%;

            background:
                repeating-radial-gradient(
                    circle,
                    #151515 0px,
                    #151515 2px,
                    #202020 3px,
                    #111 5px
                );

            box-shadow:
                0 8px 18px rgba(0, 0, 0, 0.35);

            position: relative;

            animation: spin 8s linear infinite;
        }

        /* ŚRODEK PŁYTY */

        .record::after {
            content: "";

            position: absolute;

            width: 42px;
            height: 42px;

            top: 50%;
            left: 50%;

            transform: translate(-50%, -50%);

            border-radius: 50%;

            background: #d75b9b;

            box-shadow:
                inset 0 0 5px rgba(0, 0, 0, 0.25);
        }

        .record::before {
            content: "";

            position: absolute;

            width: 7px;
            height: 7px;

            top: 50%;
            left: 50%;

            transform: translate(-50%, -50%);

            border-radius: 50%;

            background: #f8c6df;

            z-index: 2;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }


        /* PRAWA STRONA */

        .right-side {
            width: 450px;
        }

        .title {
            margin: 0 0 15px;

            font-size: 24px;
            font-weight: bold;

            color: #a43a7c;
        }


        /* FILM */

        .video {
            width: 100%;

            aspect-ratio: 16 / 9;

            border-radius: 12px;

            overflow: hidden;

            background: #d77ba9;

            box-shadow:
                0 7px 15px rgba(0, 0, 0, 0.15);
        }

        .video video {
            width: 100%;
            height: 100%;

            display: block;

            object-fit: cover;
        }


        /* NAPIS */

        .caption {
            margin-top: 35px;

            font-size: clamp(10px, 2vw, 45px);

            font-weight: bold;

            color: #4a0950;

            text-shadow:
                0 3px 10px rgba(74, 9, 80, 0.15);
        }


        /* PRZYCISK */

        .back {
            margin-top: 30px;

            padding: 13px 25px;

            border: none;
            border-radius: 15px;

            background: #4a0950;
            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.25s;
        }

        .back:hover {
            transform: scale(1.05);
        }


        /* TELEFON */

        @media (max-width: 700px) {

            body {
                padding: 30px 0;
            }

            .music-card {
                flex-direction: column;

                gap: 25px;

                padding: 25px 18px;
            }

            .record-area {
                width: 170px;
                height: 170px;
            }

            .record {
                width: 115px;
                height: 115px;
            }

            .record::after {
                width: 32px;
                height: 32px;
            }

            .record::before {
                width: 6px;
                height: 6px;
            }

            .right-side {
                width: 100%;
            }

            .title {
                font-size: 20px;
            }

            .caption {
                margin-top: 25px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- GŁÓWNA KARTA -->

        <div class="music-card">

            <!-- PŁYTA -->

            <div class="record-area">
                <div class="record"></div>
            </div>


            <!-- FILM -->

            <div class="right-side">

                <h2 class="title">
                    Piosenka ktora mi sie z nami kojarzy 💕
                </h2>

                <div class="video">

                    <video
                        controls
                        playsinline
                        preload="metadata">

                        <source src="[THAISUB] Harvey - Her’s.mp4" type="video/mp4">

                        Twoja przeglądarka nie obsługuje odtwarzania filmów.
                    </video>

                </div>

            </div>

        </div>


        <!-- NAPIS POD SPODEM -->

        <div class="caption">
            Kojazy mi sie bo to nuta uzywana w moim ulubiony romansie anime no i jakos tak nie hihi
        </div>


        <!-- POWRÓT -->

        <button class="back" onclick="location.href='hihi.html'">
            Wróć
        </button>

    </div>

</body>
</html>
