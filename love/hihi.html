<!DOCTYPE html>

<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Twoje prezenty 💕</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;

        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #fce4f5, #ead4ff);

        color: #4a0950;
    }

    h1 {
        margin-bottom: 45px;
        font-size: clamp(32px, 5vw, 55px);
        text-align: center;

        text-shadow: 0 3px 10px rgba(74, 9, 80, 0.2);
    }

    .gifts {
        display: flex;
        gap: 25px;
        justify-content: center;
        align-items: center;
        flex-wrap: wrap;
    }

    .gift {
        width: 190px;
        height: 100px;

        border: none;
        border-radius: 20px;

        background: #c729b2;
        color: white;

        font-size: 22px;
        font-weight: bold;

        cursor: pointer;

        box-shadow: 0 8px 20px rgba(74, 9, 80, 0.2);

        transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .gift:hover {
        transform: translateY(-8px) scale(1.05);
        box-shadow: 0 14px 30px rgba(74, 9, 80, 0.3);
    }

    .gift:active {
        transform: scale(0.97);
    }
</style>


</head>

<body>


<h1>Hihihi 🎁</h1>

<div class="gifts">
    <button class="gift" onclick="location.href='gift1.html'">
        🎁 Prezencik pierwszy
    </button>

    <button class="gift" onclick="location.href='gift2.html'">
        🎁 Prezencik drugi
    </button>

    <button class="gift" onclick="location.href='gift3.html'">
        🎁 Prezencik trzeci
    </button>
</div>


</body>
</html>
