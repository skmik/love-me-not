<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gift One 💕</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: 'Courier New', Courier, monospace
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background:
                radial-gradient(circle at 20% 20%, rgba(255,255,255,.7), transparent 25%),
                radial-gradient(circle at 80% 80%, rgba(255,255,255,.5), transparent 25%),
                linear-gradient(135deg, #fce4f5, #ead4ff);
            color: #4a0950;
            overflow-x: hidden;
        }

        h1 {
            text-align: center;
            margin: 45px 20px 10px;
            font-size: clamp(32px, 6vw, 52px);
            text-shadow: 0 4px 15px rgba(74, 9, 80, .18);
        }

        .subtitle {
            text-align: center;
            margin: 0 20px 45px;
            font-size: 16px;
            opacity: .7;
        }

        /* GALERIA */

        .gallery {
            width: min(1000px, 92%);
            margin: 0 auto 45px;

            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 35px 28px;
        }

        /* POLAROID */

        .photo {
            position: relative;
            background: #fff;
            padding: 10px 10px 42px;

            box-shadow:
                0 12px 30px rgba(74, 9, 80, .18),
                0 3px 8px rgba(0, 0, 0, .08);

            transition:
                transform .35s ease,
                box-shadow .35s ease;

            cursor: pointer;
        }

        .photo img {
            display: block;
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
        }

        /* RÓŻNE OBRÓCENIA */

        .photo:nth-child(1) {
            transform: rotate(-4deg);
        }

        .photo:nth-child(2) {
            transform: rotate(3deg) translateY(8px);
        }

        .photo:nth-child(3) {
            transform: rotate(-2deg);
        }

        .photo:nth-child(4) {
            transform: rotate(5deg) translateY(-5px);
        }

        .photo:nth-child(5) {
            transform: rotate(-4deg) translateY(10px);
        }

        .photo:nth-child(6) {
            transform: rotate(3deg);
        }

        .photo:nth-child(7) {
            transform: rotate(-3deg);
        }

        .photo:nth-child(8) {
            transform: rotate(4deg) translateY(8px);
        }

        .photo:nth-child(9) {
            transform: rotate(-5deg);
        }

        /* HOVER */

        .photo:hover {
            transform: rotate(0deg) scale(1.07) translateY(-8px);
            z-index: 5;

            box-shadow:
                0 25px 50px rgba(74, 9, 80, .28),
                0 5px 15px rgba(0, 0, 0, .12);
        }

        /* MAŁE SERDUSZKA */

        .photo::after {
            content: "♡";
            position: absolute;
            right: 12px;
            bottom: 8px;

            font-size: 25px;
            color: #d88ac8;
            opacity: .8;
        }

        /* DELIKATNE KROPKI W TLE */

        body::before,
        body::after {
            content: "♡";
            position: fixed;
            font-size: 80px;
            color: rgba(255,255,255,.35);
            pointer-events: none;
            z-index: -1;
        }

        body::before {
            top: 8%;
            left: 4%;
            transform: rotate(-20deg);
        }

        body::after {
            bottom: 8%;
            right: 4%;
            transform: rotate(20deg);
        }

        /* PRZYCISK */

        .back {
            display: block;
            margin: 20px auto 50px;

            padding: 13px 30px;

            border: none;
            border-radius: 20px;

            background: #4a0950;
            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;

            box-shadow: 0 8px 20px rgba(74, 9, 80, .25);

            transition:
                transform .2s ease,
                box-shadow .2s ease;
        }

        .back:hover {
            transform: scale(1.07);
            box-shadow: 0 12px 25px rgba(74, 9, 80, .35);
        }

        /* TELEFON */

        @media (max-width: 700px) {

            h1 {
                margin-top: 30px;
            }

            .subtitle {
                margin-bottom: 30px;
            }

            .gallery {
                width: 90%;
                grid-template-columns: repeat(2, 1fr);
                gap: 25px 15px;
            }

            .photo {
                padding: 7px 7px 30px;
            }

            .photo::after {
                font-size: 20px;
                right: 8px;
                bottom: 4px;
            }
        }

        @media (max-width: 420px) {

            .gallery {
                gap: 20px 10px;
            }

            .photo {
                padding: 5px 5px 25px;
            }

            .photo:hover {
                transform: rotate(0deg) scale(1.04);
            }
        }
    </style>
</head>

<body>

    <h1>Nasze zdjęcia 📸💕</h1>

    <p class="subtitle">
    </p>

    <div class="gallery">

        <div class="photo">
            <img src="p1.png" alt="Zdjęcie 1"> Tea Body
        </div>

        <div class="photo">
            <img src="p2.jpg" alt="Zdjęcie 2"> :3
        </div>

        <div class="photo">
            <img src="p3.jpg" alt="Zdjęcie 3"> Bedzie w pape
        </div>

        <div class="photo">
            <img src="p4.jpg" alt="Zdjęcie 4"> ✌️
        </div>

        <div class="photo">
            <img src="p5.jpg" alt="Zdjęcie 5"> Straszenie dzieci :3
        </div>

        <div class="photo">
            <img src="p6.jpg" alt="Zdjęcie 6"> :P
        </div>

        <div class="photo">
            <img src="p7.jpg" alt="Zdjęcie 7"> Gangówa
        </div>

        <div class="photo">
            <img src="p8.jpg" alt="Zdjęcie 8"> Princess Treatment
        </div>

        <div class="photo">
            <img src="p9.jpg" alt="Zdjęcie 9"> Tuff czy cos
        </div>

    </div>

    <button class="back" onclick="location.href='hihi.html'">
        Wróć
    </button>

</body>
</html>
